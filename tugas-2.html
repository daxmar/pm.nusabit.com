<body class="bg-dark-bg text-gray-100 font-sans min-h-screen p-4">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-8 py-6 border-b-2 border-primary/50">
            <h1 class="text-3xl font-extrabold text-primary flex items-center justify-center space-x-3">
                <i class="fas fa-pencil-alt"></i> <span>Tugas Pertemuan 2</span>
            </h1>
            <p class="text-gray-400 mt-2">Logika Dasar Kehidupan Sehari-hari</p>
            <div class="flex justify-center gap-4 mt-4">
                <a href="index.php" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-lg transition-all text-sm">
                    <i class="fas fa-home mr-2"></i>Home
                </a>
                <button onclick="openAdminModal()" class="px-4 py-2 bg-gray-800 border border-gray-600 hover:bg-gray-700 text-gray-300 font-bold rounded-lg transition-all text-sm">
                    <i class="fas fa-lock mr-2"></i>Lihat Jawaban
                </button>
            </div>
        </header>

        <main>
            <form action="submit_tugas.php" method="POST" class="space-y-6">
                <input type="hidden" name="materi_soal" value="tugas-2.html">

                <div class="bg-card-bg rounded-xl p-6 border border-gray-700">
                    <h2 class="text-xl font-semibold mb-2 text-primary">Soal 1: Sequence</h2>
                    <label class="text-gray-400 text-sm mb-4 block">Urutan meminjam buku IPA diperpus SMP lantai 2:</label>
                    <textarea name="jawaban_1" rows="4" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-600 focus:ring-1 focus:ring-primary outline-none text-gray-200" placeholder="misal : 1. Jalan pergi ke Perpustakaan..."></textarea>
                </div>
 
                <div class="bg-card-bg rounded-xl p-6 border border-gray-700">
                    <h2 class="text-xl font-semibold mb-2 text-primary">Soal 2: If-Else</h2>
                    <label class="text-gray-400 text-sm mb-4 block">Contoh logika "JIKA" sehari-hari:</label>
                    <textarea name="jawaban_2" rows="3" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-600 focus:ring-1 focus:ring-primary outline-none text-gray-200" placeholder="misal : JIKA lapar MAKA makan..."></textarea>
                </div>

                <div class="bg-card-bg rounded-xl p-6 border border-gray-700">
                    <h2 class="text-xl font-semibold mb-2 text-primary">Soal 3: Looping</h2>
                    <label class="text-gray-400 text-sm mb-4 block">Kapan kita butuh perulangan?</label>
                    <textarea name="jawaban_3" rows="3" class="w-full p-3 bg-gray-800 rounded-lg border border-gray-600 focus:ring-1 focus:ring-primary outline-none text-gray-200"placeholder="misal : Menggosok sepatu dengan sikat sampai bersih"></textarea>
                </div>

                <button type="submit" class="w-full py-4 bg-primary hover:bg-cyan-500 text-dark-bg font-bold rounded-xl transition-all text-lg shadow-lg">
                    <i class="fas fa-paper-plane mr-2"></i> Kirim Jawaban
                </button>
            </form>
        </main>
    </div>

    <div id="admin-modal" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-card-bg w-full max-w-6xl rounded-xl border border-gray-700 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800 rounded-t-xl">
                <div class="flex items-center gap-3">
                    <h3 class="text-xl font-bold text-primary"><i class="fas fa-database"></i> Data Jawaban</h3>
                    <span id="refresh-status" class="text-[10px] bg-green-900 text-green-300 px-2 py-1 rounded hidden animate-pulse">AUTO-REFRESH AKTIF</span>
                </div>
                <button onclick="closeAdminModal()" class="text-gray-400 hover:text-white transition-colors"><i class="fas fa-times fa-lg"></i></button>
            </div>
            
            <div class="p-6 overflow-y-auto custom-scroll flex-1 bg-dark-bg">
                <div id="password-section" class="text-center py-10">
                    <i class="fas fa-lock text-4xl text-gray-600 mb-4"></i>
                    <h4 class="text-xl font-bold text-white mb-6">Masukkan Password Admin</h4>
                    <div class="flex max-w-sm mx-auto gap-2">
                        <input type="password" id="admin-pass" class="flex-1 bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 text-white outline-none focus:border-primary" placeholder="Password...">
                        <button onclick="fetchAnswers()" class="bg-primary text-dark-bg font-bold px-6 py-2 rounded-lg hover:bg-cyan-400 transition-all">Buka</button>
                    </div>
                    <p id="error-msg" class="text-red-500 mt-4 hidden">Password salah!</p>
                </div>

                <div id="answers-content" class="hidden"></div>
            </div>
        </div>
    </div>

    <script>
        let refreshInterval = null;

        function openAdminModal() { 
            document.getElementById('admin-modal').classList.remove('hidden'); 
            document.getElementById('admin-pass').focus(); 
        }

        function closeAdminModal() { 
            document.getElementById('admin-modal').classList.add('hidden'); 
            document.getElementById('answers-content').innerHTML = ''; 
            document.getElementById('answers-content').classList.add('hidden'); 
            document.getElementById('password-section').classList.remove('hidden'); 
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('refresh-status').classList.add('hidden');
            if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
        }

        function fetchAnswers() {
            const pass = document.getElementById('admin-pass').value;
            const formData = new FormData();
            formData.append('password', pass);
            formData.append('materi_soal', 'tugas-2.html');

            fetch('get_answers.php', { method: 'POST', body: formData })
            .then(response => response.text())
            .then(html => {
                if (html.includes('Password salah')) {
                    document.getElementById('error-msg').classList.remove('hidden');
                } else {
                    document.getElementById('password-section').classList.add('hidden');
                    document.getElementById('refresh-status').classList.remove('hidden');
                    const content = document.getElementById('answers-content');
                    
                    // Update content
                    content.innerHTML = `
                        <p class="text-[10px] text-gray-500 mb-4 uppercase tracking-widest text-right">Update Terakhir: ${new Date().toLocaleTimeString()}</p>
                        ${html}
                    `;
                    content.classList.remove('hidden');

                    // Set interval 5 detik jika belum ada
                    if (!refreshInterval) {
                        refreshInterval = setInterval(fetchAnswers, 5000);
                    }
                }
            })
            .catch(err => console.error("Error fetching data:", err));
        }

        document.getElementById('admin-pass').addEventListener('keypress', (e) => { if (e.key === 'Enter') fetchAnswers(); });
    </script>
</body>
</html>
