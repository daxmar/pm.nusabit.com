<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="icon" type="image/png" href="https://nusabit.com/assets/logo-48.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Pertemuan 5 - Tombol Ajaib</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#10B981', // Teal matching materi-5
                        'dark-bg': '#111827',
                        'card-bg': '#1F2937',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 min-h-screen flex items-center justify-center p-8 font-sans">

    <div class="bg-card-bg max-w-md w-full p-12 rounded-3xl border border-primary/50 shadow-2xl text-center space-y-8">
        <!-- Magic Sparkle Icon -->
        <div class="w-24 h-24 bg-gradient-to-br from-primary to-emerald-500 rounded-3xl flex items-center justify-center mx-auto shadow-2xl border-4 border-white/20 mb-6 animate-pulse">
            <i class="fas fa-magic text-3xl text-white drop-shadow-lg"></i>
        </div>
        
        <div>
            <h1 class="text-3xl font-black text-white mb-4 bg-gradient-to-r from-primary to-emerald-400 bg-clip-text text-transparent">
                Tugas 5: Tombol Ajaib
            </h1>
            <p class="text-gray-400 text-lg leading-relaxed">
                Masukkan password untuk membuka akses materi interaktif.<br>
                <span class="text-primary font-semibold">Petunjuk: Nama atribut utama di materi ini</span>
            </p>
        </div>

        <div class="space-y-4">
            <input type="password" id="task-pass" placeholder="Ketik password disini..." 
                   class="w-full bg-gray-900 border-2 border-gray-700 rounded-2xl p-4 text-xl text-center font-mono tracking-wider focus:outline-none focus:border-primary focus:ring-4 focus:ring-primary/20 transition-all text-white shadow-inner">
            <p id="error-msg" class="text-red-400 text-sm font-mono hidden animate-pulse">❌ Password salah! Coba lagi.</p>
        </div>

        <button onclick="checkPassword()" 
                class="w-full py-6 px-8 bg-gradient-to-r from-primary to-emerald-500 hover:from-emerald-500 hover:to-teal-600 text-white font-black text-xl rounded-2xl shadow-2xl hover:shadow-3xl hover:scale-105 transition-all duration-300 border-0 transform-gpu">
            <i class="fas fa-unlock mr-3"></i>
            Buka Keajaiban!
        </button>

        <div class="flex justify-center pt-6 border-t border-gray-700">
            <a href="index.php" class="text-gray-500 hover:text-gray-300 text-sm font-medium flex items-center gap-2 transition-colors">
                <i class="fas fa-home"></i>
                Kembali ke Home
            </a>
        </div>
    </div>

    <script>
        function checkPassword() {
            const pass = document.getElementById('task-pass').value.toLowerCase().trim();
            // Password: "onclick" (sesuai materi-5)
            if (pass === 'onclick') {
                // Redirect langsung ke materi-5.html
                window.location.href = 'materi-5.html';
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
                document.getElementById('task-pass').focus();
                document.getElementById('task-pass').style.borderColor = '#ef4444';
                setTimeout(() => {
                    document.getElementById('error-msg').classList.add('hidden');
                    document.getElementById('task-pass').style.borderColor = '#374151';
                }, 3000);
            }
        }

        // Enter key support
        document.getElementById('task-pass').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        // Auto-focus
        window.onload = () => document.getElementById('task-pass').focus();
    </script>

</body>
</html>
