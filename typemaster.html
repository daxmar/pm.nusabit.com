        body {

        .text-mono {

        }
        .key {
            user-select: none;
            cursor: pointer;
            box-shadow: 0 4px 0 0 rgb(31 41 55);
            transition: all 0.05s ease;
        }
        .key:active, .key.pressed {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 rgb(31 41 55);
        }
        .correct-char {
            color: #4ade80; /* Green 400 */
        }
        .incorrect-char {
            background-color: #f87171; /* Red 400 */
            color: #ffffff;
            border-radius: 2px;
        }
        .cursor-char {
            background-color: #fcd34d; /* Yellow 300 */
            color: #1f2937;
            border-radius: 2px;
            animation: blink 1s step-start 0s infinite;
        }
        @keyframes blink {
            50% { background-color: transparent; color: inherit; }
        }
        .key.highlight {
            background-color: #fcd34d !important;
            color: #1f2937 !important;
            border-color: #f59e0b !important;

    <script>
        const textSamples = [
            "ketika kita melihat ke masa depan, penting untuk diingat bahwa teknologi bukanlah tujuan akhir, melainkan alat yang memungkinkan kita mencapai potensi penuh sebagai manusia.",
            "fokus pada pembelajaran berkelanjutan, adaptasi cepat, dan inovasi adalah kunci untuk menavigasi lanskap digital yang terus berubah dengan sukses dan integritas.",
            "mengetik dengan cepat dan akurat adalah keterampilan fundamental di era digital, membuka pintu ke efisiensi dan komunikasi yang lebih baik dalam berbagai aspek kehidupan.",
            "jangan pernah meremehkan kekuatan dari sebuah latihan yang konsisten; setiap hari adalah kesempatan baru untuk menjadi versi yang lebih baik dari diri sendiri.",
            "kesalahan adalah bagian tak terpisahkan dari proses belajar, jadi terimalah setiap kesalahan, perbaiki, dan terus maju dengan pola pikir yang positif dan berkembang."
        ];
        
        let targetText = "";
        const $textDisplay = document.getElementById('text-display');
        const $typingInput = document.getElementById('typing-input');
        const $wpmDisplay = document.getElementById('wpm-display');
        const $accuracyDisplay = document.getElementById('accuracy-display');
        const $errorsDisplay = document.getElementById('errors-display');
        const $resetButton = document.getElementById('reset-button');
        const $keyboardKeys = document.querySelectorAll('.key');

        let currentIndex = 0;
        let errors = 0;
        let startTime = null;
        let isStarted = false;
        let totalTypedCharacters = 0;
        let timerInterval = null;

        function initializeTest() {
            currentIndex = 0;
            errors = 0;
            startTime = null;
            isStarted = false;
            totalTypedCharacters = 0;
            clearInterval(timerInterval);
            
            $wpmDisplay.textContent = '0';
            $accuracyDisplay.textContent = '100%';
            $errorsDisplay.textContent = '0';
            $typingInput.value = '';
            
            targetText = textSamples[Math.floor(Math.random() * textSamples.length)];

            renderText();
            highlightNextKey();
            $typingInput.focus();
        }

        function renderText() {
            let htmlContent = '';
            const typedText = $typingInput.value;
            
            for (let i = 0; i < targetText.length; i++) {
                const char = targetText[i];
                
                if (i < currentIndex) {
                    if (typedText[i] === char) {
                        htmlContent += `<span class="correct-char">${char}</span>`;
                    } else {
                        // Jika salah ketik, tampilkan karakter asli dengan background merah
                        htmlContent += `<span class="incorrect-char">${char}</span>`;
                    }
                } else if (i === currentIndex) {
                    htmlContent += `<span class="cursor-char">${char}</span>`;
                } else {
                    htmlContent += `<span class="text-gray-500">${char}</span>`;
                }
            }
            $textDisplay.innerHTML = htmlContent;
        }

        function updateStats() {
            if (!isStarted || !startTime) return;

            const timeElapsed = (new Date().getTime() - startTime) / 60000;
            if (timeElapsed <= 0) return;

            const wpm = Math.round((totalTypedCharacters / 5) / timeElapsed);
            const accuracy = totalTypedCharacters > 0 
                ? Math.round(((totalTypedCharacters - errors) / totalTypedCharacters) * 100) 
                : 100;
            
            $wpmDisplay.textContent = Math.max(0, wpm);
            $accuracyDisplay.textContent = `${Math.max(0, accuracy)}%`;
            $errorsDisplay.textContent = errors;
        }
        
        function finishTest() {
            isStarted = false;
            clearInterval(timerInterval);
            $textDisplay.innerHTML += `<p class="mt-4 text-green-400 font-bold">Tes Selesai! Skor Akhir: ${$wpmDisplay.textContent} WPM (Words Per Minute)</p>`;
            $keyboardKeys.forEach(key => key.classList.remove('highlight'));
        }

        function highlightNextKey() {
            $keyboardKeys.forEach(key => key.classList.remove('highlight'));
            if (currentIndex >= targetText.length) return;

            const requiredChar = targetText[currentIndex];
            const requiredCode = mapCharToKey(requiredChar);

            if (requiredCode) {
                const keyElement = document.querySelector(`[data-key="${requiredCode}"]`);
                if (keyElement) keyElement.classList.add('highlight');
                
                if (isShiftRequired(requiredChar)) {
                    document.querySelector('[data-key="ShiftLeft"]').classList.add('highlight');
                    document.querySelector('[data-key="ShiftRight"]').classList.add('highlight');
                }
            }
        }
        
        function mapCharToKey(char) {
            const charMap = {
                ' ': 'Space', ',': 'Comma', '.': 'Period', '/': 'Slash',
                ';': 'Semicolon', "'": 'Quote', '[': 'BracketLeft',
                ']': 'BracketRight', '\\': 'Backslash', '-': 'Minus',
                '=': 'Equal', '`': 'Backquote', '!': 'Digit1', '@': 'Digit2',
                '#': 'Digit3', '$': 'Digit4', '%': 'Digit5', '^': 'Digit6',
                '&': 'Digit7', '*': 'Digit8', '(': 'Digit9', ')': 'Digit0'
            };
            if (char.toUpperCase() !== char.toLowerCase() && char !== ' ') return 'Key' + char.toUpperCase();
            return charMap[char] || null;
        }
        
        function isShiftRequired(char) {
            return /[A-Z!@#$%^&*()_+{}|:"<>?~]/.test(char);
        }

        // --- Event Listeners ---

        document.addEventListener('keydown', (e) => {
            const keyElement = document.querySelector(`[data-key="${e.code}"]`);
            if (keyElement) keyElement.classList.add('pressed');

            if (e.metaKey || e.ctrlKey || e.altKey) return;
            
            if (!isStarted && e.key.length === 1) {
                startTime = new Date().getTime();
                isStarted = true;
                timerInterval = setInterval(updateStats, 1000);
            }

            // PENTING: Jangan gunakan preventDefault pada spasi agar input terisi
            $typingInput.focus();
        });
        
        document.addEventListener('keyup', (e) => {
            const keyElement = document.querySelector(`[data-key="${e.code}"]`);
            if (keyElement) keyElement.classList.remove('pressed');
        });

        $typingInput.addEventListener('input', (e) => {
            if (!isStarted) return;
            
            const typedValue = e.target.value;
            
            // Hitung ulang index dan error berdasarkan panjang input saat ini
            if (typedValue.length < currentIndex) {
                // User melakukan backspace
                currentIndex = typedValue.length;
            } else {
                // User mengetik karakter baru
                const lastCharTyped = typedValue[typedValue.length - 1];
                const expectedChar = targetText[currentIndex];
                
                totalTypedCharacters++;
                if (lastCharTyped !== expectedChar) {
                    errors++;
                }
                currentIndex = typedValue.length;
            }

            renderText();
            updateStats();
            highlightNextKey();
            
            if (currentIndex === targetText.length) finishTest();
        });
        
        $resetButton.addEventListener('click', initializeTest);

        window.onload = initializeTest;
    </script>
