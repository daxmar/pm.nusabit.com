<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper - Asah Logika</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr); /* 10x10 grid */
            grid-template-rows: repeat(10, 1fr);
            border: 4px solid #374151;
            background-color: #4b5563;
        }
        .cell {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #9ca3af;
            border: 2px outset #d1d5db;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Mono', monospace;
            font-weight: bold;
            font-size: 1.25rem;
            cursor: pointer;
        }
        .cell.revealed {
            background-color: #4b5563;
            border: 1px solid #374151;
        }
        .cell.mine {
            background-color: #ef4444;
        }
        .color-1 { color: #3b82f6; } /* blue */
        .color-2 { color: #22c55e; } /* green */
        .color-3 { color: #ef4444; } /* red */
        .color-4 { color: #8b5cf6; } /* violet */
        .color-5 { color: #a16207; } /* dark yellow */
        .color-6 { color: #06b6d4; } /* cyan */
        .color-7 { color: #111827; } /* black */
        .color-8 { color: #71717a; } /* gray */
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex flex-col items-center justify-center p-4 text-white">

    <div class="w-full max-w-lg">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <a href="index.php" class="text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-arrow-left mr-2"></i>Home
            </a>
            <h1 class="text-2xl font-bold text-teal-400">Minesweeper</h1>
        </div>

        <!-- Stats -->
        <div class="bg-slate-800 rounded-xl p-4 mb-6 flex justify-between items-center shadow-lg border border-slate-700">
            <div class="text-center">
                <p class="text-xs text-slate-400 uppercase">Bom</p>
                <p id="mines-count" class="text-xl font-bold text-red-400">10</p>
            </div>
            <button id="restart-button" class="bg-teal-600 hover:bg-teal-500 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
            <div class="text-center">
                <p class="text-xs text-slate-400 uppercase">Waktu</p>
                <p id="timer" class="text-xl font-bold text-yellow-400">0</p>
            </div>
        </div>

        <!-- Game Grid -->
        <div id="game-board" class="grid-container mx-auto">
            <!-- Cells will be generated here -->
        </div>

        <!-- Game Over Modal -->
        <div id="modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 backdrop-blur-sm">
            <div class="bg-slate-800 p-8 rounded-2xl text-center border border-teal-500/50 shadow-2xl max-w-sm mx-4">
                <div id="modal-icon" class="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl">
                    <!-- Icon here -->
                </div>
                <h2 id="modal-title" class="text-3xl font-bold text-white mb-2"></h2>
                <p id="modal-text" class="text-slate-300 mb-6"></p>
                <button id="modal-restart-button" class="w-full bg-teal-600 hover:bg-teal-500 text-white py-3 rounded-xl font-bold transition-all">
                    Main Lagi
                </button>
            </div>
        </div>
    </div>

    <script>
        const GRID_SIZE = 10;
        const MINE_COUNT = 10;

        const boardElement = document.getElementById('game-board');
        const minesCountElement = document.getElementById('mines-count');
        const timerElement = document.getElementById('timer');
        const restartButton = document.getElementById('restart-button');
        const modal = document.getElementById('modal');
        const modalRestartButton = document.getElementById('modal-restart-button');

        let board = [];
        let minesLeft = MINE_COUNT;
        let timer = 0;
        let timerInterval = null;
        let gameOver = false;
        let firstClick = true;

        function initGame() {
            gameOver = false;
            firstClick = true;
            minesLeft = MINE_COUNT;
            boardElement.innerHTML = '';
            minesCountElement.textContent = minesLeft;
            modal.classList.add('hidden');
            
            stopTimer();
            timer = 0;
            timerElement.textContent = 0;

            board = Array.from({ length: GRID_SIZE }, () => 
                Array.from({ length: GRID_SIZE }, () => ({
                    isMine: false,
                    isRevealed: false,
                    isFlagged: false,
                    adjacentMines: 0
                }))
            );

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cellElement = document.createElement('div');
                    cellElement.classList.add('cell');
                    cellElement.dataset.row = r;
                    cellElement.dataset.col = c;
                    
                    cellElement.addEventListener('click', () => handleCellClick(r, c));
                    cellElement.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleRightClick(r, c);
                    });

                    boardElement.appendChild(cellElement);
                }
            }
        }

        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                timer++;
                timerElement.textContent = timer;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function placeMines(initialRow, initialCol) {
            let minesPlaced = 0;
            while (minesPlaced < MINE_COUNT) {
                const row = Math.floor(Math.random() * GRID_SIZE);
                const col = Math.floor(Math.random() * GRID_SIZE);

                if (!board[row][col].isMine && (row !== initialRow || col !== initialCol)) {
                    board[row][col].isMine = true;
                    minesPlaced++;
                }
            }
        }

        function calculateAdjacentMines() {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c].isMine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = r + dr;
                            const nc = c + dc;
                            if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE && board[nr][nc].isMine) {
                                count++;
                            }
                        }
                    }
                    board[r][c].adjacentMines = count;
                }
            }
        }

        function handleCellClick(row, col) {
            if (gameOver || board[row][col].isRevealed || board[row][col].isFlagged) return;

            if (firstClick) {
                placeMines(row, col);
                calculateAdjacentMines();
                startTimer();
                firstClick = false;
            }

            const cell = board[row][col];
            if (cell.isMine) {
                endGame(false);
                return;
            }

            revealCell(row, col);
            checkWinCondition();
        }

        function handleRightClick(row, col) {
            if (gameOver || board[row][col].isRevealed) return;

            const cell = board[row][col];
            const cellElement = getCellElement(row, col);

            cell.isFlagged = !cell.isFlagged;
            if (cell.isFlagged) {
                cellElement.innerHTML = '<i class="fas fa-flag text-red-600"></i>';
                minesLeft--;
            } else {
                cellElement.innerHTML = '';
                minesLeft++;
            }
            minesCountElement.textContent = minesLeft;
        }

        function revealCell(row, col) {
            if (row < 0 || row >= GRID_SIZE || col < 0 || col >= GRID_SIZE) return;
            
            const cell = board[row][col];
            if (cell.isRevealed || cell.isFlagged) return;

            cell.isRevealed = true;
            const cellElement = getCellElement(row, col);
            cellElement.classList.add('revealed');

            if (cell.adjacentMines > 0) {
                cellElement.textContent = cell.adjacentMines;
                cellElement.classList.add(`color-${cell.adjacentMines}`);
            } else {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        revealCell(row + dr, col + dc);
                    }
                }
            }
        }

        function checkWinCondition() {
            let revealedCount = 0;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c].isRevealed) {
                        revealedCount++;
                    }
                }
            }
            if (revealedCount === (GRID_SIZE * GRID_SIZE) - MINE_COUNT) {
                endGame(true);
            }
        }

        function endGame(isWin) {
            gameOver = true;
            stopTimer();

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c].isMine) {
                        const cellElement = getCellElement(r, c);
                        cellElement.classList.add('revealed', 'mine');
                        cellElement.innerHTML = '<i class="fas fa-bomb"></i>';
                    }
                }
            }

            const modalIcon = document.getElementById('modal-icon');
            const modalTitle = document.getElementById('modal-title');
            const modalText = document.getElementById('modal-text');

            if (isWin) {
                modalIcon.className = 'w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl bg-green-500/20 text-green-400';
                modalIcon.innerHTML = '<i class="fa-solid fa-trophy"></i>';
                modalTitle.textContent = 'Kamu Menang!';
                modalText.textContent = `Selamat! Kamu menyelesaikan permainan dalam ${timer} detik.`;
            } else {
                modalIcon.className = 'w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl bg-red-500/20 text-red-400';
                modalIcon.innerHTML = '<i class="fa-solid fa-bomb"></i>';
                modalTitle.textContent = 'Game Over!';
                modalText.textContent = 'Kamu menginjak ranjau. Coba lagi!';
            }
            modal.classList.remove('hidden');
        }

        function getCellElement(row, col) {
            return boardElement.children[row * GRID_SIZE + col];
        }

        restartButton.addEventListener('click', initGame);
        modalRestartButton.addEventListener('click', initGame);

        initGame();
    </script>
</body>
</html>
